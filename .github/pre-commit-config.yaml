fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: format
        entry: just fmt
        types: [rust]
        language: system
        pass_filenames: false
      - id: clippy
        entry: just clippy
        types: [rust]
        language: system
        pass_filenames: false
      - id: test
        entry: just test
        types: [rust]
        language: system
        pass_filenames: false
      - id: test-doc
        name: Doctests
        entry: just test-doc
        types: [rust]
        language: system
        pass_filenames: false
      - id: unused-deps
        entry: just check-unused-deps
        files: '(\.rs|Cargo\.toml)$'
        language: system
        pass_filenames: false
      - id: docs
        entry: just docs-check
        files: '^(docs/|\.agents/skills/|AGENTS\.md$|CLAUDE\.md$)'
        language: system
        pass_filenames: false
